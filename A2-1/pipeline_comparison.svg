<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title description">
  <title id="title">Sơ đồ so sánh hai pipeline ALPR E1 và E2</title>
  <desc id="description">Ảnh phương tiện đi qua detector YOLO26n dùng chung, sau đó vùng biển số được chuyển tới hai pipeline nhận dạng CRNN-BiLSTM-CTC và PDLPR. Hai kết quả được đánh giá và so sánh.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#526579"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #0b1f33; }
      .label { font-size: 19px; font-weight: 600; }
      .detail { font-size: 15px; }
      .small { font-size: 14px; fill: #526579; }
      .flow { fill: none; stroke: #526579; stroke-width: 2.5; marker-end: url(#arrow); }
      .connector { fill: none; stroke: #526579; stroke-width: 2.5; }
      .node { fill: #f4f8fc; stroke: #526579; stroke-width: 2; }
      .shared { fill: #eaf2ff; stroke: #2563eb; stroke-width: 2; }
      .e1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .e2 { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .module { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="370" y="24" width="460" height="66" rx="12" class="node"/>
  <text x="600" y="64" text-anchor="middle" class="label">Ảnh phương tiện đầu vào</text>

  <path d="M600 90v34" class="flow"/>
  <rect x="370" y="130" width="460" height="70" rx="12" class="shared"/>
  <text x="600" y="173" text-anchor="middle" class="label">Detector YOLO26n dùng chung</text>

  <path d="M600 200v34" class="flow"/>
  <rect x="370" y="240" width="460" height="70" rx="12" class="node"/>
  <text x="600" y="270" text-anchor="middle" class="label">Bounding box biển số</text>
  <text x="600" y="293" text-anchor="middle" class="small">Trích xuất plate crop</text>

  <path d="M600 310v24H320v28" class="flow"/>
  <path d="M600 334h280v28" class="flow"/>

  <rect x="55" y="370" width="530" height="166" rx="14" class="e1"/>
  <text x="320" y="402" text-anchor="middle" class="label">E1 — CRNN-BiLSTM-CTC</text>
  <rect x="75" y="424" width="145" height="76" rx="9" class="module"/>
  <text x="147.5" y="469" text-anchor="middle" class="detail">CNN</text>
  <path d="M220 462h25" class="flow"/>
  <rect x="250" y="424" width="145" height="76" rx="9" class="module"/>
  <text x="322.5" y="469" text-anchor="middle" class="detail">BiLSTM</text>
  <path d="M395 462h25" class="flow"/>
  <rect x="425" y="424" width="140" height="76" rx="9" class="module"/>
  <text x="495" y="469" text-anchor="middle" class="detail">CTC</text>

  <rect x="615" y="370" width="530" height="166" rx="14" class="e2"/>
  <text x="880" y="402" text-anchor="middle" class="label">E2 — PDLPR</text>
  <rect x="635" y="424" width="145" height="76" rx="9" class="module"/>
  <text x="707.5" y="469" text-anchor="middle" class="detail">IGFE</text>
  <path d="M780 462h25" class="flow"/>
  <rect x="810" y="424" width="155" height="76" rx="9" class="module"/>
  <text x="887.5" y="456" text-anchor="middle" class="detail">Encoder</text>
  <text x="887.5" y="478" text-anchor="middle" class="small">Multi-Head Attention</text>
  <path d="M965 462h25" class="flow"/>
  <rect x="995" y="424" width="130" height="76" rx="9" class="module"/>
  <text x="1060" y="456" text-anchor="middle" class="detail">Parallel</text>
  <text x="1060" y="478" text-anchor="middle" class="detail">Decoder</text>

  <path d="M320 536v27" class="flow"/>
  <path d="M880 536v27" class="flow"/>
  <rect x="135" y="570" width="370" height="56" rx="11" class="node"/>
  <text x="320" y="605" text-anchor="middle" class="label">Chuỗi biển số dự đoán E1</text>
  <rect x="695" y="570" width="370" height="56" rx="11" class="node"/>
  <text x="880" y="605" text-anchor="middle" class="label">Chuỗi biển số dự đoán E2</text>

  <path d="M320 626v20h280" class="connector"/>
  <path d="M880 626v20H600" class="connector"/>
  <path d="M600 646v10" class="flow"/>
  <rect x="370" y="660" width="460" height="60" rx="12" class="shared"/>
  <text x="600" y="698" text-anchor="middle" class="label">Đánh giá và so sánh</text>
</svg>
