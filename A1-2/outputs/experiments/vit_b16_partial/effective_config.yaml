project:
  name: food101_cnn_vs_transformer
  seed: 42
  num_classes: 101
data:
  dataset_name: food101
  root: /content/food-101
  manifest_dir: /content/deep-learning-computer-vision-co5085/A1-2/data/manifests
  image_size: 224
  resize_short_edge: 256
  train_val_seed: 42
  train_per_class: 675
  validation_per_class: 75
  test_per_class: 250
  horizontal_flip_probability: 0.5
  manifest_path: /content/deep-learning-computer-vision-co5085/A1-2/data/manifests/food101_split_seed42.csv
training:
  batch_size: 32
  max_epochs: 30
  early_stopping_patience: 5
  early_stopping_min_delta: 0.0
  num_workers: 2
  pin_memory: true
  use_amp: true
  optimizer: AdamW
  regime: partial_finetuning
  weight_decay: 0.01
  momentum: 0.9
  scratch_learning_rate: 0.001
  head_learning_rate: 0.001
  backbone_learning_rate: 0.0001
  scheduler:
    name: CosineAnnealingLR
    cosine_annealing:
      T_max: 30
      eta_min: 0.0
    step:
      step_size: 10
      gamma: 0.1
  selection_metric: macro_f1
  tie_break_metric: accuracy
experiments:
  architectures:
  - resnet50
  - vit_b16
  pretrained: true
  regimes:
  - from_scratch
  - frozen_backbone
  - partial_finetuning
  - full_finetuning
  resnet50_runs:
    resnet50_frozen:
      architecture: resnet50
      pretrained: true
      regime: frozen_backbone
    resnet50_partial:
      architecture: resnet50
      pretrained: true
      regime: partial_finetuning
    resnet50_full_finetune:
      architecture: resnet50
      pretrained: true
      regime: full_finetuning
evaluation:
  metrics:
  - accuracy
  - macro_f1
  - trainable_parameters
  - training_time_seconds
  evaluate_test_after_validation_selection: false
reproducibility:
  deterministic: false
  log_environment: true
experiment:
  name: vit_b16_partial
  architecture: vit_b16
  regime: partial_finetuning
  pretrained: true
